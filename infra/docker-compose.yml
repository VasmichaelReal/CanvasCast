# Локальна інфраструктура CanvasCast. Порти на хості зсунуті, щоб не
# конфліктувати з уже встановленими Postgres/Redis.
name: canvascast
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: canvascast
      POSTGRES_PASSWORD: canvascast
      POSTGRES_DB: canvascast
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvascast"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]

  # S3-сумісне сховище для зображень і аудіо. RustFS — відкрита заміна MinIO
  # (образи MinIO прибрано з публічних реєстрів). У продакшні тут буде R2 або S3.
  storage:
    image: rustfs/rustfs:1.0.6
    # Локальна розробка: root усередині контейнера знімає питання прав на том.
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: canvascast
      RUSTFS_SECRET_KEY: canvascast-secret
    ports: ["9100:9000", "9101:9001"]
    volumes: [storagedata:/data]

volumes:
  pgdata:
  redisdata:
  storagedata:
