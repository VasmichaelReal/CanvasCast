# Воркер генерації на Render (безкоштовний тариф).
# Render → New → Blueprint → вибрати цей репозиторій. Значення секретів вводяться в панелі.
services:
  - type: web
    name: canvascast-worker
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev
    startCommand: npm run start -w @canvascast/worker
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: canvascast
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: TTS_PROVIDER
        value: edge
      - key: GENERATIONS_PER_MINUTE
        value: "4"
